services:
  - type: web
    name: erleravm-aptus0
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ErlerAVM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://erleravm-aptus0.onrender.com
      - key: ASSET_URL
        value: https://erleravm-aptus0.onrender.com
      - key: API_DOMAIN
        value: api.erleravm-aptus0.onrender.com
      - key: API_URL
        value: https://api.erleravm-aptus0.onrender.com
      - key: ADMIN_DOMAIN
        value: erleravm-aptus0.onrender.com
      - key: ADMIN_URL
        value: https://erleravm-aptus0.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: erleravm-db
          property: connectionString
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_DOMAIN
        value: (null)
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log
      - key: PAYTR_TEST_MODE
        value: "true"
      - key: AKBANK_ENABLED
        value: "false"

databases:
  - name: erleravm-db
    plan: free
    region: frankfurt
    databaseName: erleravm
    user: erleravm
